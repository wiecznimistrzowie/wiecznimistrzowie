name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and test
    env:
      DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/wiecznimistrzowie

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: wiecznimistrzowie
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Migrate database
        run: bin/sequel -m db/migrations $DATABASE_URL
      - name: Migrate en57
        run: bundle exec rake en57:migrate
      - name: "Linter: Standard"
        run: bundle exec rake standard
      - name: Tests
        run: bundle exec rake test
